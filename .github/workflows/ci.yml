name: CI

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      force-publish:
        type: boolean
        required: false
        default: false
      publish-even-non-main-branch:
        type: boolean
        required: false
        default: false

jobs:
  tests:
    name: Run tests
    if: github.event.inputs.force-publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: ^11.6.0
          run_install: true
      - env:
          TEST_PUBLISHER_ID: ${{ secrets.TEST_PUBLISHER_ID }}
          TEST_CLIENT_ID: ${{ secrets.TEST_CLIENT_ID }}
          TEST_CLIENT_SECRET: ${{ secrets.TEST_CLIENT_SECRET }}
          TEST_REFRESH_TOKEN: ${{ secrets.TEST_REFRESH_TOKEN }}
          TEST_EXTENSION_ID: ${{ secrets.TEST_EXTENSION_ID }}
        run: pnpm test
  publish:
    name: Publish action
    needs: tests
    if: |
      always() &&
      (
        (github.ref_name == 'main' || github.event.inputs.publish-even-non-main-branch == 'true') &&
        (success() || github.event.inputs.force-publish == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: wdzeng/action-of-action@v3
